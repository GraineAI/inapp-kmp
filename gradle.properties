org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The iOS targets build on a Mac with Xcode; the newest Xcode is newer than this
# Kotlin release knows, which it says on every build. The build is still checked.
kotlin.apple.xcodeCompatibility.nowarn=true
# The shared iosMain sees the facade's binding (one cinterop for the three iOS targets).
kotlin.mpp.enableCInteropCommonization=true

# The published version of both artifacts (ai.graine:inapp-kmp, ai.graine:inapp-kmp-compose).
# GraineKmpVersion.NAME must match (a unit test checks).
GRAINE_VERSION=0.14.4
# The Android SDK the Android side delegates to, when it is resolved from Maven
# (settings.gradle.kts: -Pgraine.localAndroidSdk=false, or a standalone checkout).
GRAINE_ANDROID_VERSION=0.14.4
# The iOS SDK the iOS side delegates to — what an app adds with CocoaPods or SwiftPM.
GRAINE_IOS_VERSION=0.14.4
